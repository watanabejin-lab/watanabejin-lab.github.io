<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JIN Watanabe - Portfolio">
    <title>JIN Watanabe</title>
    <style>
        /* 共通の爆速・軽量設定 */
        :root {
            --bg: #ffffff;
            --text-main: #111111;
            --text-sub: #777777;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        
        /* テキストエリア */
        .text-box {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
            box-sizing: border-box;
        }
        h1 {
            font-size: clamp(2.5rem, 5vw, 5rem);
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: var(--text-sub);
            margin: 20px 0 0;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* 画像エリア */
        .img-box {
            width: 40%;
            height: 100%;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* PC版での顔の位置調整 */
            object-position: 45% 20%;
            display: block;
        }

        /* ▼▼ スマホ（iPhone等）用の自動切り替えレイアウト ▼▼ */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse; /* スマホでは画像を上、文字を下へ */
                height: auto;
                min-height: 100vh;
            }
            .text-box {
                width: 100%;
                height: 45vh;
                padding: 10% 8%;
                align-items: center;
                text-align: center;
            }
            .img-box {
                width: 100%;      /* 横幅を100%にして横切れを完全防止 */
                height: 55vh;     /* 画面の半分強を画像に */
            }
            .img-box img {
                /* スマホで目と口が絶対に切れないようにピンポイント調整 */
                object-position: 45% 15%; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-box">
            <h1>JIN Watanabe</h1>
            <p>Creator & Engineer</p>
        </div>
        <div class="img-box">
            <!-- fetchpriority="high" で画像の読み込み速度を極限までブースト -->
            <img src="jin.webp" alt="JIN Watanabe" fetchpriority="high">
        </div>
    </div>
</body>
</html>
