lass\x3d\\\x22data-title\\\x22\x3eMEDICINE \x26 SCIENCE\x3c\\\/h3\x3e\x3c\\\/header\x3e\x3cp\x3e医学・生命科学・自然科学。生命の仕組みを理解し、医学の力で人々を直接笑顔にすることを目指しています。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eLAW \x26 POLITICS\x3c\\\/h3\x3e\x3c\\\/header\x3e\x3cp\x3e法律・政治・歴史・社会制度。人々の権利や社会の仕組みを理解し、より公正な社会の実現を通じて、幅広い人々の幸せに貢献することを目指しています。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eLEADERSHIP \x26 DESIGN\x3c\\\/h3\x3e\x3c\\\/header\x3e\x3cp\x3e生徒会活動・組織運営・制度設計。アイデアを形にし、既存の仕組みをより良く変えることで、より多くの人を笑顔にすることを目指しています。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eART \x26 CREATIVITY\x3c\\\/h3\x3e\x3c\\\/header\x3e\x3cp\x3e絵画・デザイン・表現。自分の考えや感情を、色や形、言葉を通じて表現することを楽しんでいます。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eTECHNOLOGY \x26 INNOVATION\x3c\\\/h3\x3e\x3c\\\/header\x3e\x3cp\x3eテクノロジー・情報技術・新しい発想。技術を活用して身近な課題を解決し、人々の暮らしをより便利で楽しいものにする可能性を探っています。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3c\\\/div\x3e\x3c\\\/div\x3e\x3c\\\/section\x3e\x3csection class\x3d\\\x22section\\\x22 id\x3d\\\x22activities\\\x22\x3e\x3cdiv class\x3d\\\x22grid\\\x22\x3e\x3ch2 class\x3d\\\x22section-title\\\x22\x3eActivities\x3c\\\/h2\x3e\x3cdiv class\x3d\\\x22content\\\x22\x3e\x3cp style\x3d\\\x22font-size:1.25rem;font-weight:700;margin-bottom:var(--space-md);\\\x22\x3e考え、挑戦し、アイデアを形にする。\x3c\\\/p\x3e\x3cdiv class\x3d\\\x22data-list\\\x22\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3ePRODUCT DESIGN\x3c\\\/h3\x3e\x3cspan class\x3d\\\x22data-meta\\\x22\x3e2023 ふせるんOKぇ〜｜第54回 市村アイデア賞 佳作\x3c\\\/span\x3e\x3c\\\/header\x3e\x3cp\x3e「注意する」のではなく「自然と正しい行動をしたくなる道具をつくる」という発想から、風呂桶のプロダクトを開発しました。普通に置くと倒れやすく、伏せると安定する形状を考案。身近な課題を独自の視点で捉え、人の行動そのものをデザインした作品です。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eSTUDENT COUNCIL\x3c\\\/h3\x3e\x3cspan class\x3d\\\x22data-meta\\\x22\x3e2026- 高校生徒会総務\x3c\\\/span\x3e\x3c\\\/header\x3e\x3cp\x3e中学校時代、立候補する勇気を持てなかった経験をきっかけに、高校では勇気を出して、生徒会選挙に立候補。中高一貫校へ外部進学した新しい環境で挑戦し、選挙を経て生徒会総務に当選しました。現在は、生徒の声とアイデアをもとに、学校をより良くするための活動に取り組んでいます。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3carticle class\x3d\\\x22data-item\\\x22\x3e\x3cheader class\x3d\\\x22data-header\\\x22\x3e\x3ch3 class\x3d\\\x22data-title\\\x22\x3eCREATIVE DESIGN\x3c\\\/h3\x3e\x3cspan class\x3d\\\x22data-meta\\\x22\x3e2026 ダサいスライド全国大会｜ラムダ技術部賞\x3c\\\/span\x3e\x3c\\\/header\x3e\x3cp\x3e技育祭2026【秋】を紹介するダサいスライドを、蛍光色や過度な装飾ではなく、あえて行政資料のようなデザインで制作しました。情報の優先順位が整理されていない構成や大量の装飾、独特の配色・文字組みを意図的に組み合わせ、「真面目なのに、どこかダサい」という表現を追求。スライド本体だけでなくファイル名に至るまで作り込み、ラムダ技術部賞を受賞しました。2026年10月11日にはラムダさんと虎ノ門ヒルズで登壇しました。\x3c\\\/p\x3e\x3c\\\/article\x3e\x3c\\\/div\x3e\x3c\\\/div\x3e\x3c\\\/div\x3e\x3c\\\/section\x3e\x3csection class\x3d\\\x22section\\\x22 id\x3d\\\x22vision\\\x22\x3e\x3cdiv class\x3d\\\x22grid\\\x22\x3e\x3ch2 class\x3d\\\x22section-title\\\x22\x3eVision\x3c\\\/h2\x3e\x3cdiv class\x3d\\\x22content\\\x22\x3e\x3cp style\x3d\\\x22font-size:1.25rem;font-weight:700;margin-bottom:var(--space-md);\\\x22\x3e学びを力に、人々の幸せを創る。\x3c\\\/p\x3e\x3cp\x3e将来は、医学部で医学を学び、医師として人々の命と健康を支えたいと考えています。その後、法科大学院で法律を学び、医師と弁護士、二つの専門性を備えた立場から、医療と社会の課題に向き合うことを目指しています。\x3c\\\/p\x3e\x3cp\x3eさらに、医療と法律の知識、そしてこれまで培ってきた経験を地域社会に還元し、ふるさとである美作市の市議会議員、そして市長として、まちの未来を担い、人々の幸せに貢献したいと考えています。\x3c\\\/p\x3e\x3cp\x3e人々の幸せは、医療だけでも、法律だけでも、実現できるものではありません。医師・弁護士として、目の前の一人ひとりと向き合い、直接その人を救う。一方で、政治家として、社会の仕組みや制度をより良くすることで、多くの人々を間接的に救う。人の命と権利を守り、地域の可能性を広げていく。僕は、医師・弁護士、そして政治家として、より多くの人を笑顔にし、幸せにできると信じています。\x3c\\\/p\x3e\x3c\\\/div\x3e\x3c\\\/div\x3e\x3c\\\/section\x3e\x3cfooter class\x3d\\\x22footer\\\x22\x3e\x3cnav class\x3d\\\x22footer-links\\\x22\x3e\x3ca href\x3d\\\x22https:\/\/x.com\/gapaogome\\\x22 target\x3d\\\x22_blank\\\x22 rel\x3d\\\x22noopener\\\x22\x3eX\x3c\\\/a\x3e\x3ca href\x3d\\\x22https:\/\/www.instagram.com\/jinjin20110111\/\\\x22 target\x3d\\\x22_blank\\\x22 rel\x3d\\\x22noopener\\\x22\x3eInstagram\x3c\\\/a\x3e\x3ca href\x3d\\\x22https:\/\/note.com\/gapaogome0111\\\x22 target\x3d\\\x22_blank\\\x22 rel\x3d\\\x22noopener\\\x22\x3enote\x3c\\\/a\x3e\x3c\\\/nav\x3e\x3cdiv class\x3d\\\x22copyright\\\x22\x3e\x26copy; 2026 JIN Watanabe. All rights reserved.\x3c\\\/div\x3e\x3c\\\/footer\x3e\x3c\\\/main\x3e\x3c\\\/body\x3e\x3c\\\/html\x3e\x22,\x22ncc\x22:\x22\x7b\\\x22awhs\\\x22:true\x7d\x22\x7d", "AMllMq9ZaGu3kXa3od2bt_hvx4TR:1793933959552", undefined, false , true  , "true", "https:\/\/n-6ycnddnvzgrhmv7arkcrcczkicx3f3f6mo5gxey-0lu-script.googleusercontent.com", "https:\/\/drive.google.com\/abuse?id\x3dAFS7AdtESOQyW9Qd7rZegW9odbmUfjWPgUIdCnw9OCiQX-Q4AF2YDnAJyx3id8n_kVo3qKhOhDrpZtEiEiVL7DbxfRRQKXNDFr2z9WqP%3A0\x26docurl\x3dhttps%3A%2F%2Fscript.google.com%2Fa%2Fmacros%2Fgse.okayama-c.ed.jp%2Fs%2FAKfycbzWM-HN06T1gsAZwe5ZzKbepJmZrxKKPMQJdFfc0NROCj_6YT7xDlqO455J9NGTa7Gm%2Fexec");}
